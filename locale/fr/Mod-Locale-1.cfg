[tips-and-tricks-item-description]
baketorio-tips-category=Trucs et Astuces de Baketorio
baketorio-nutrient-setting=L'outil NutriGen est disponible aux machines d'assemblage pour faciliter le choix de recette de nutriments en fonction des ingrédients en entrée. Lorsque l'on ouvre une machine d'assemblage, on peut sélectionner les ingrédients en entrée choisis pour produire des nutriments, et la machine va automatiquement définir la recetta appropriée.


